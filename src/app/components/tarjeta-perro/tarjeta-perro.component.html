<ion-card>
  <img [src]="perro.foto" [alt]="perro.nombre" />
  <ion-card-header>
    <ion-card-title>{{ perro.nombre }}</ion-card-title>
    <ion-card-subtitle>{{ perro.raza }}</ion-card-subtitle>
  </ion-card-header>
  
  <ion-card-content>
    <p>{{ perro.edad }} - {{ perro.sexo }}</p>
    <ion-button expand="full" [routerLink]="['/detalle', perro.id]">
      Ver más
    </ion-button>
  </ion-card-content>
</ion-card>
